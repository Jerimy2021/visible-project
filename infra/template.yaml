AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Visible - WhatsApp (Meta) -> movimientos -> DynamoDB -> respuesta

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    CodeUri: ../src

Resources:
  # --- Almacenamiento ------------------------------------------------------
  EvidenciasBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-evidencias-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  MovimientosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-movimientos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: telefono
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: telefono
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  IdempotenciaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-idempotencia"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PerfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-perfiles"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: telefono
          AttributeType: S
      KeySchema:
        - AttributeName: telefono
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- Procesamiento (async) ----------------------------------------------
  ProcesarLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-procesar"
      RetentionInDays: 14

  ProcesarFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProcesarLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-procesar"
      Handler: visible.adapters.inbound.procesar.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          EXTRACTOR: bedrock
          GRAPH_API_VERSION: v25.0
          MODEL_ID: us.anthropic.claude-sonnet-4-6
          MODEL_ID_FALLBACK: us.anthropic.claude-haiku-4-5-20251001-v1:0
          META_ACCESS_TOKEN_PARAM: /visible/meta/access_token
          META_PHONE_NUMBER_ID_PARAM: /visible/meta/phone_number_id
          BUCKET_EVIDENCIAS: !Ref EvidenciasBucket
          TABLA_MOVIMIENTOS: !Ref MovimientosTable
          TABLA_IDEMPOTENCIA: !Ref IdempotenciaTable
          TABLA_PERFILES: !Ref PerfilesTable
          LINK_PANEL: !Sub "https://${WebDistribution.DomainName}"
      Policies:
        - Statement:
            - Sid: LeerParamsMeta
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/visible/meta/*"
            - Sid: DescifrarViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: GuardarEvidencias
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${EvidenciasBucket.Arn}/*"
            - Sid: EscribirMovimientos
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:BatchWriteItem
                - dynamodb:UpdateItem
              Resource: !GetAtt MovimientosTable.Arn
            - Sid: ReservarIdempotencia
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:GetItem
              Resource: !GetAtt IdempotenciaTable.Arn
            - Sid: EscribirPerfil
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt PerfilesTable.Arn
            - Sid: InvocarBedrock
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                - !Sub "arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*"

  # --- API del panel (solo lectura) ---------------------------------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Handler: visible.adapters.inbound.api.handler
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLA_MOVIMIENTOS: !Ref MovimientosTable
          TABLA_PERFILES: !Ref PerfilesTable
          BUCKET_EVIDENCIAS: !Ref EvidenciasBucket
          CORS_ORIGIN: !Sub "https://${WebDistribution.DomainName}"
      Policies:
        - Statement:
            - Sid: LeerPerfiles
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource: !GetAtt PerfilesTable.Arn
            - Sid: LeerMovimientos
              Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt MovimientosTable.Arn
            - Sid: LeerEvidencias
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${EvidenciasBucket.Arn}/*"
      Events:
        Lista:
          Type: HttpApi
          Properties:
            Path: /perfiles
            Method: GET
        Ficha:
          Type: HttpApi
          Properties:
            Path: /perfiles/{id}
            Method: GET

  # --- Webhook (inbound) ---------------------------------------------------
  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: 14

  WebhookFunction:
    Type: AWS::Serverless::Function
    DependsOn: WebhookLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      Handler: visible.adapters.inbound.meta_webhook.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          META_APP_SECRET_PARAM: /visible/meta/app_secret
          META_VERIFY_TOKEN_PARAM: /visible/meta/verify_token
          PROCESAR_FUNCTION_NAME: !Ref ProcesarFunction
      Policies:
        - Statement:
            - Sid: LeerParamsMeta
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/visible/meta/*"
            - Sid: DescifrarViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: InvocarProcesar
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt ProcesarFunction.Arn
      Events:
        WebhookPost:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: POST
        WebhookGet:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: GET

  # --- Panel web (S3 privado + CloudFront OAC) -----------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-panel-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-panel-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Visible - panel del analista
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: webbucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: webbucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution.Id}"

Outputs:
  WebhookUrl:
    Description: URL del webhook para configurar en Meta (callback URL)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  PerfilesUrl:
    Description: Endpoint de la API del panel (lista de perfiles)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/perfiles"
  ApiBaseUrl:
    Description: Base de la API (para VITE_API_URL)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  WebUrl:
    Description: URL del panel (CloudFront)
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Description: Bucket del panel web
    Value: !Ref WebBucket
  WebDistributionId:
    Description: Id de la distribución CloudFront (para invalidar)
    Value: !Ref WebDistribution
