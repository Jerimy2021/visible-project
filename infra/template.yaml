AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Brigada - inspección mensual de extintores (importador + tablas)

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    CodeUri: ../src

Resources:
  # --- Tablas (SharePoint -> DynamoDB) ------------------------------------
  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-sites"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: codigo, AttributeType: S }
      KeySchema:
        - { AttributeName: codigo, KeyType: HASH }

  ExtintoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-extintores"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: codigo, AttributeType: S }
      KeySchema:
        - { AttributeName: codigo, KeyType: HASH }

  MantenimientosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-mantenimientos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: codigo, AttributeType: S }
        - { AttributeName: periodo, AttributeType: S }
        - { AttributeName: site, AttributeType: S }
      KeySchema:
        - { AttributeName: codigo, KeyType: HASH }
        - { AttributeName: periodo, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: site-periodo
          KeySchema:
            - { AttributeName: site, KeyType: HASH }
            - { AttributeName: periodo, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AprobacionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-aprobaciones"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: site, AttributeType: S }
        - { AttributeName: periodo, AttributeType: S }
      KeySchema:
        - { AttributeName: site, KeyType: HASH }
        - { AttributeName: periodo, KeyType: RANGE }

  UsuariosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-usuarios"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: telefono_whatsapp, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: telefono
          KeySchema:
            - { AttributeName: telefono_whatsapp, KeyType: HASH }
          Projection: { ProjectionType: ALL }

  # Reutilizada para el bot (idempotencia de mensajes de WhatsApp).
  IdempotenciaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-idempotencia"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- Importador ----------------------------------------------------------
  ImportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-import-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  ImportProcessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-import-process"
      RetentionInDays: 14

  ImportProcessFunction:
    Type: AWS::Serverless::Function
    DependsOn: ImportProcessLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-import-process"
      Handler: visible.adapters.inbound.importar.procesar_subida
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          TABLA_SITES: !Ref SitesTable
          TABLA_EXTINTORES: !Ref ExtintoresTable
          TABLA_MANTENIMIENTOS: !Ref MantenimientosTable
          TABLA_APROBACIONES: !Ref AprobacionesTable
          TABLA_USUARIOS: !Ref UsuariosTable
      Policies:
        - Statement:
            - Sid: LeerEscribirImport
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              # ARN construido (no !GetAtt) para evitar dependencia circular con el evento S3.
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-import-${AWS::AccountId}/*"
            - Sid: UpsertTablas
              Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                - !GetAtt SitesTable.Arn
                - !GetAtt ExtintoresTable.Arn
                - !GetAtt MantenimientosTable.Arn
                - !GetAtt AprobacionesTable.Arn
                - !GetAtt UsuariosTable.Arn
      Events:
        Subida:
          Type: S3
          Properties:
            Bucket: !Ref ImportBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: uploads/ }

  ImportApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-import-api"
      RetentionInDays: 14

  ImportApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ImportApiLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-import-api"
      Handler: visible.adapters.inbound.importar.solicitar_url
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_IMPORT: !Ref ImportBucket
          CORS_ORIGIN: !Sub "https://${WebDistribution.DomainName}"
      Policies:
        - Statement:
            - Sid: FirmarSubida
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ImportBucket.Arn}/*"
      Events:
        Url:
          Type: HttpApi
          Properties:
            Path: /import/url
            Method: POST
        UrlOptions:
          Type: HttpApi
          Properties:
            Path: /import/url
            Method: OPTIONS

  # --- API del Centro de control (solo lectura, con API key) ---------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Handler: visible.adapters.inbound.api.handler
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          TABLA_SITES: !Ref SitesTable
          TABLA_EXTINTORES: !Ref ExtintoresTable
          TABLA_MANTENIMIENTOS: !Ref MantenimientosTable
          TABLA_APROBACIONES: !Ref AprobacionesTable
          TABLA_USUARIOS: !Ref UsuariosTable
          API_KEY_PARAM: /visible/brigada/api_key
          CORS_ORIGIN: !Sub "https://${WebDistribution.DomainName}"
      Policies:
        - Statement:
            - Sid: LeerTablas
              Effect: Allow
              Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem]
              Resource:
                - !GetAtt SitesTable.Arn
                - !GetAtt ExtintoresTable.Arn
                - !GetAtt MantenimientosTable.Arn
                - !Sub "${MantenimientosTable.Arn}/index/*"
                - !GetAtt AprobacionesTable.Arn
                - !GetAtt UsuariosTable.Arn
            - Sid: LeerApiKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/visible/brigada/api_key"
            - Sid: DescifrarViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        Centro:
          Type: HttpApi
          Properties:
            Path: /centro
            Method: GET
        Extintores:
          Type: HttpApi
          Properties:
            Path: /extintores
            Method: GET
        Extintor:
          Type: HttpApi
          Properties:
            Path: /extintor/{codigo}
            Method: GET
        Pendientes:
          Type: HttpApi
          Properties:
            Path: /inspectores/{id}/pendientes
            Method: GET
        CentroOpt:
          Type: HttpApi
          Properties:
            Path: /centro
            Method: OPTIONS
        ExtintoresOpt:
          Type: HttpApi
          Properties:
            Path: /extintores
            Method: OPTIONS
        ExtintorOpt:
          Type: HttpApi
          Properties:
            Path: /extintor/{codigo}
            Method: OPTIONS

  # --- Bot de WhatsApp ------------------------------------------------------
  BotLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-bot"
      RetentionInDays: 14

  BotFunction:
    Type: AWS::Serverless::Function
    DependsOn: BotLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-bot"
      Handler: visible.adapters.inbound.bot.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLA_SITES: !Ref SitesTable
          TABLA_EXTINTORES: !Ref ExtintoresTable
          TABLA_MANTENIMIENTOS: !Ref MantenimientosTable
          TABLA_APROBACIONES: !Ref AprobacionesTable
          TABLA_USUARIOS: !Ref UsuariosTable
          TABLA_IDEMPOTENCIA: !Ref IdempotenciaTable
          META_ACCESS_TOKEN_PARAM: /visible/meta/access_token
          META_PHONE_NUMBER_ID_PARAM: /visible/meta/phone_number_id
          MODEL_ID_BOT: us.anthropic.claude-haiku-4-5-20251001-v1:0
          MODEL_ID_BOT_FALLBACK: us.anthropic.claude-sonnet-4-6
      Policies:
        - Statement:
            - Sid: LeerTablas
              Effect: Allow
              Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem]
              Resource:
                - !GetAtt SitesTable.Arn
                - !GetAtt ExtintoresTable.Arn
                - !GetAtt MantenimientosTable.Arn
                - !Sub "${MantenimientosTable.Arn}/index/*"
                - !GetAtt AprobacionesTable.Arn
                - !GetAtt UsuariosTable.Arn
                - !Sub "${UsuariosTable.Arn}/index/*"
            - Sid: EscribirMantYIdem
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:BatchWriteItem]
              Resource:
                - !GetAtt MantenimientosTable.Arn
                - !GetAtt IdempotenciaTable.Arn
            - Sid: LeerParamsMeta
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/visible/meta/*"
            - Sid: DescifrarViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: InvocarBedrock
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*"

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: 14

  WebhookFunction:
    Type: AWS::Serverless::Function
    DependsOn: WebhookLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      Handler: visible.adapters.inbound.meta_webhook.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          META_APP_SECRET_PARAM: /visible/meta/app_secret
          META_VERIFY_TOKEN_PARAM: /visible/meta/verify_token
          BOT_FUNCTION_NAME: !Ref BotFunction
      Policies:
        - Statement:
            - Sid: LeerParamsMeta
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/visible/meta/*"
            - Sid: DescifrarViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: InvocarBot
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt BotFunction.Arn
      Events:
        Post:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: POST
        Get:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: GET

  RecordatorioLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-recordatorio"
      RetentionInDays: 14

  RecordatorioFunction:
    Type: AWS::Serverless::Function
    DependsOn: RecordatorioLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-recordatorio"
      Handler: visible.adapters.inbound.recordatorio.handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          TABLA_SITES: !Ref SitesTable
          TABLA_EXTINTORES: !Ref ExtintoresTable
          TABLA_MANTENIMIENTOS: !Ref MantenimientosTable
          TABLA_APROBACIONES: !Ref AprobacionesTable
          TABLA_USUARIOS: !Ref UsuariosTable
          META_ACCESS_TOKEN_PARAM: /visible/meta/access_token
          META_PHONE_NUMBER_ID_PARAM: /visible/meta/phone_number_id
          PLANTILLA_RECORDATORIO: hello_world
          PLANTILLA_IDIOMA: en_US
      Policies:
        - Statement:
            - Sid: LeerTablas
              Effect: Allow
              Action: [dynamodb:Scan]
              Resource:
                - !GetAtt SitesTable.Arn
                - !GetAtt ExtintoresTable.Arn
                - !GetAtt MantenimientosTable.Arn
                - !GetAtt AprobacionesTable.Arn
                - !GetAtt UsuariosTable.Arn
            - Sid: LeerParamsMeta
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/visible/meta/*"
            - Sid: DescifrarViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        Diario:
          Type: Schedule
          Properties:
            # 13:00 UTC = 08:00 America/Lima
            Schedule: cron(0 13 * * ? *)

  # --- Panel (S3 privado + CloudFront OAC); el dashboard llega en el paso 4 -
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-panel-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-panel-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Brigada - panel
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: webbucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: webbucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution.Id}"

Outputs:
  ImportUrl:
    Description: Endpoint para pedir URL de subida de CSV
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/import/url"
  WebhookUrl:
    Description: Callback URL de Meta (misma que Visible)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  ApiBaseUrl:
    Description: Base de la API (para VITE_API_URL)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ImportBucketName:
    Value: !Ref ImportBucket
  WebUrl:
    Description: URL del panel (CloudFront)
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
